<div class="min-h-screen flex items-start justify-center bg-[#0c110e] p-16">
    <div class="flex flex-col items-center gap-6 bg-[#111a14] border border-[#1a2e22] rounded-xl p-10 w-full max-w-sm">
    
        <h1 class="text-xl font-medium text-emerald-50">Вхід</h1>

        <div class="flex flex-col gap-3 w-full">
            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500">Email</label>
                <input [formControl]="form.controls.email" type="email" placeholder="email@gmail.com"
                    class="bg-[#0c110e] border border-[#1a2e22] rounded-lg px-3 py-2 text-emerald-50 text-sm outline-none w-full"/>
                @if (form.controls.email.invalid && submitted) {
                    <p class="text-red-400 text-xs">пошта обов'язкова</p>
                }
            </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs text-gray-500">Пароль</label>
            <input [formControl]="form.controls.password" type="password" placeholder="••••••••"
                class="bg-[#0c110e] border border-[#1a2e22] rounded-lg px-3 py-2 text-emerald-50 text-sm outline-none w-full"/>
            @if (form.controls.password.invalid && submitted) {
                <p class="text-red-400 text-xs">мінімум 6 символів</p>
            }
        </div>
    </div>

        <button (click)="login()" class="w-full bg-green-900 text-green-400 rounded-lg py-2.5 font-medium cursor-pointer hover:bg-green-800">
            Увійти
        </button>

        @if (errorMessage()) {
            <p class="text-red-400 text-xs text-center">{{ errorMessage() }}</p>
        }

        <p class="text-xs text-gray-500">
            Немає акаунту? 
            <a routerLink="/register" class="text-green-400">Зареєструватись</a>
        </p>
    </div>
</div>
