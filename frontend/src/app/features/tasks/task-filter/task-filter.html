<div class="flex flex-col h-full p-4">
  <span class="text-xs text-gray-500 uppercase tracking-wider">Категорії</span>

  <div class="flex flex-col gap-2 mt-2 flex-1 overflow-y-auto">
    <div (click)="categorySelected.emit(null)"
      class="px-3 py-2 rounded-lg text-sm cursor-pointer"
      [class.bg-green-900]="selectedCategoryId === null"
      [class.text-green-400]="selectedCategoryId === null"
      [class.text-gray-500]="selectedCategoryId !== null">
      Всі
    </div>

    @for (category of categories; track category.id) {
      <div class="group flex items-center justify-between px-3 py-2 rounded-lg text-sm cursor-pointer"
        [class.bg-green-900]="selectedCategoryId === category.id"
        [class.text-green-400]="selectedCategoryId === category.id"
        [class.text-gray-500]="selectedCategoryId !== category.id"
        (click)="categorySelected.emit(category.id)">
        
        <span>{{ category.name }}</span>

        <div class="hidden group-hover:flex gap-1">
          <button (click)="$event.stopPropagation(); editCategory.emit(category)" class="hover:text-green-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
              <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/>
            </svg>
          </button>
          <button (click)="$event.stopPropagation(); deleteCategory.emit(category.id)" class="hover:text-red-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
              <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
            </svg>
          </button>
        </div>
      </div>
    }
  </div>

  <button (click)="createCategory.emit()" class="px-4 py-2 text-sm whitespace-nowrap bg-green-900 text-green-400 rounded-lg font-medium cursor-pointer hover:bg-green-800">
    + Категорія
  </button>
</div>
